<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>联系我们 - DWGC2E</title><meta name="description" content="DWGC2E 问题反馈与联系渠道"><link rel="stylesheet" href="css/style.css"><link rel="icon" href="favicon.svg"></head><body><header class="site-header scrolled"><div class="container nav-wrap"><a class="brand" href="index.html"><img src="assets/logo.svg" alt="" width="34" height="34"><span>DWGC2E</span></a><a class="btn btn-ghost btn-sm" href="index.html">返回首页</a></div></header><main class="legal-page container contact-page"><h1>联系我们</h1><p class="legal-note">遇到安装、翻译或图纸兼容问题？请提交详细信息，我们会在客服渠道开放后处理。</p><section class="contact-grid"><div><h2>反馈前请准备</h2><ul><li>软件版本和 Windows 版本</li><li>DWG / DXF 文件类型及来源</li><li>可复现步骤和错误截图</li><li>是否使用了自定义术语表</li></ul><p><strong>客服邮箱：</strong><span id="contactEmail">暂未公布</span></p></div><form id="feedbackForm" class="feedback-form" novalidate><label>联系邮箱<input name="email" type="email" autocomplete="email" required placeholder="用于接收回复"></label><label>问题类型<select name="category"><option value="installation">安装问题</option><option value="translation">翻译问题</option><option value="compatibility">图纸兼容</option><option value="other">其他</option></select></label><label>问题描述<textarea name="message" rows="6" required minlength="10" placeholder="请描述问题、复现步骤和期望结果"></textarea></label><button class="btn btn-primary" type="submit">提交反馈</button><p id="feedbackMessage" class="form-message" role="status"></p></form></section><section><h2>下载与发布</h2><p>官网使用 Cloudflare Pages 托管，安装包通过配置的下载地址发布。下载入口如有变化，会在首页和更新日志同步。</p></section></main><footer class="site-footer"><div class="container footer-copy" style="text-align:center">© 2026 DWGC2E</div></footer><script src="js/site-config.js"></script><script src="js/contact.js"></script></body></html>
