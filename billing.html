<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>套餐与订单 - DWGC2E</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/billing.css"><link rel="icon" href="favicon.svg"></head>
<body><header class="account-header"><a class="brand" href="index.html"><img src="assets/logo.svg" alt="" width="34" height="34"><span>DWGC2E</span></a></header>
<main class="portal-page"><section class="portal-card"><a class="portal-back" href="account.html">← 返回账户中心</a><span class="eyebrow">MEMBERSHIP / TEST CHECKOUT</span><h1>开通 Pro，继续你的设计</h1><p>当前为受控支付测试：两档均为 Pro 7 天。有效期内续费增加 7 天，不重置已用翻译额度。</p>
<p id="membership" class="billing-membership">正在同步会员信息…</p><div id="plans" class="portal-grid"></div>
<fieldset class="billing-channel"><legend>选择支付方式</legend><label><input type="radio" name="channel" value="alipay" checked> 支付宝</label><label><input type="radio" name="channel" value="wxpay"> 微信支付</label></fieldset>
<p id="portalMessage" class="form-message" role="status" aria-live="polite"></p><a id="loginLink" class="btn btn-primary" href="account.html?return=billing.html" hidden>登录后购买</a>
<section id="checkout" class="billing-checkout" hidden aria-labelledby="checkoutTitle"><div><span class="eyebrow">SECURE CHECKOUT</span><h2 id="checkoutTitle">扫码支付</h2><strong id="paymentAmount" class="billing-amount"></strong><p id="paymentChannel"></p><div id="qrBox" class="billing-qr"></div><p>请使用对应支付 App 扫码；手机端可使用另一台设备扫码。请勿重复付款。</p></div><div><h3>订单详情</h3><p id="orderNo" class="billing-order-no"></p><p id="countdown"></p><p id="paymentStatus" role="status" aria-live="polite"></p><button id="refreshOrder" class="btn btn-ghost">我已付款，刷新状态</button><p>付款结果以服务器确认为准。挂机检测或通知延迟时，会员可能稍后到账；请保留订单号。</p></div></section>
<section class="orders-section"><h2>最近订单</h2><div id="orderList" class="portal-empty">正在加载订单…</div><button id="moreOrders" class="btn btn-ghost" hidden>加载更多</button></section>
</section></main><script src="js/site-config.js"></script><script src="js/api-client.js"></script><script src="js/vendor/qrcode.js"></script><script src="js/vendor/qrcode_UTF8.js"></script><script src="js/billing.js"></script></body></html>
