<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>术语词汇管理 - DWGC2E</title><meta name="description" content="管理 DWGC2E 翻译术语词汇"><link rel="stylesheet" href="css/style.css"><link rel="icon" href="favicon.svg"></head><body><header class="account-header"><a class="brand" href="index.html"><img src="assets/logo.svg" alt="" width="34" height="34"><span>DWGC2E</span></a><a class="account-home" href="account.html">返回账户中心</a></header><main class="portal-page"><section class="portal-card glossary-card"><span class="eyebrow">GLOSSARY</span><h1>术语词汇管理</h1><p>术语库应在 Windows 客户端中维护并参与本地替换；本页面仅保留数据结构预览，不作为正式操作入口。</p><div class="glossary-toolbar"><input id="glossarySearch" type="search" placeholder="搜索原文、译文或备注"><button id="syncGlossary" class="btn btn-ghost" type="button">同步云端</button><button id="exportGlossary" class="btn btn-ghost" type="button">导出词汇</button><label class="btn btn-ghost file-button">导入词汇<input id="importGlossary" type="file" accept="application/json,.csv,text/csv"></label></div><form id="glossaryForm" class="glossary-form"><input name="source" required placeholder="原文术语"><input name="target" required placeholder="译文"><input name="note" placeholder="备注（可选）"><button id="saveGlossary" class="btn btn-primary" type="submit">添加词条</button><button id="cancelGlossary" class="btn btn-ghost" type="button" hidden>取消编辑</button></form><div class="table-actions"><label><input id="selectAll" type="checkbox"> 全选</label><button id="deleteSelected" class="btn btn-ghost btn-sm" type="button">删除选中</button><span id="glossaryCount">共 0 条</span></div><div class="table-scroll"><table class="glossary-table"><thead><tr><th></th><th>原文</th><th>译文</th><th>备注</th><th>操作</th></tr></thead><tbody id="glossaryList"></tbody></table></div><p id="glossaryMessage" class="form-message" role="status"></p></section></main><script src="js/site-config.js"></script><script src="js/api-client.js"></script><script src="js/terminology.js"></script></body></html>
