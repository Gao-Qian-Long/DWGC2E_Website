<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>开始翻译 - DWGC2E</title><meta name="description" content="DWGC2E CAD 图纸翻译任务"><link rel="stylesheet" href="css/style.css"><link rel="icon" href="favicon.svg"></head><body><header class="account-header"><a class="brand" href="index.html"><img src="assets/logo.svg" alt="" width="34" height="34"><span>DWGC2E</span></a></header><main class="portal-page"><section class="portal-card translate-card"><div class="portal-topbar"><button type="button" class="portal-back" data-back-button aria-label="返回上一页"><span aria-hidden="true">←</span> 返回</button><a class="portal-home-link" href="account.html">账户中心</a></div><span class="eyebrow">TRANSLATE</span><h1>开始翻译</h1><p>图纸解析、术语替换和 AI 翻译均在 Windows 客户端完成。本页面仅保留接口对接预览，不承担实际文件处理。</p><form id="translateForm" class="translate-form"><label class="dropzone"><input id="files" type="file" accept=".dwg,.dxf" multiple><strong>选择 DWG / DXF 文件</strong><span>支持多选，文件将在接口开放后上传到 Worker</span></label><ul id="fileList" class="file-list"></ul><div class="translate-options"><label>原语言<select name="source_language"><option value="auto">自动识别</option><option value="en">英语</option><option value="ja">日语</option><option value="ko">韩语</option></select></label><label>目标语言<select name="target_language"><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文</option><option value="en">英语</option></select></label><label>术语词库<select name="glossary_id"><option value="">不使用词库</option><option value="local">浏览器本地词库（占位）</option></select></label></div><button class="btn btn-primary" type="submit">客户端处理说明</button><p id="translateMessage" class="form-message" role="status"></p></form></section></main><script src="js/site-config.js"></script><script src="js/api-client.js"></script><script src="js/translate.js"></script></body></html>
