<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账户中心 - DWGC2E</title><meta name="description" content="DWGC2E 账户中心：登录、查看套餐与翻译额度。"><link rel="stylesheet" href="css/style.css"><link rel="icon" href="favicon.svg"></head>
<body><header class="site-header scrolled"><div class="container nav-wrap"><a class="brand" href="index.html"><img src="assets/logo.svg" alt="" width="34" height="34"><span>DWGC2E</span></a><a class="btn btn-ghost btn-sm" href="index.html">返回首页</a></div></header>
<main class="legal-page container account-page"><h1>账户中心</h1><p class="legal-note" id="accountStatus">登录后查看套餐、额度和设备状态。</p>
<section id="authPanel" class="account-card"><div class="account-tabs" role="tablist"><button class="account-tab active" type="button" data-auth-mode="login">登录</button><button class="account-tab" type="button" data-auth-mode="register">注册</button><button class="account-tab" type="button" data-auth-mode="forgot">忘记密码</button></div>
<form id="accountForm" novalidate><label>账号<input name="account" autocomplete="username" required minlength="3" placeholder="邮箱或账号"></label><label>密码<input name="password" type="password" autocomplete="current-password" required minlength="8" placeholder="至少 8 位"></label><label class="register-only">显示名称<input name="display_name" autocomplete="name" placeholder="可选"></label><label class="register-only">邮箱<input name="email" type="email" autocomplete="email" placeholder="可选"></label><label class="register-only">设备名称<input name="device_name" placeholder="我的电脑"></label><label class="forgot-only">邮箱<input name="email" type="email" autocomplete="email" placeholder="注册时填写的邮箱"></label><label class="forgot-only">验证码<input name="code" inputmode="numeric" autocomplete="one-time-code" placeholder="输入邮箱收到的 6 位验证码"></label><button class="btn btn-ghost forgot-only" type="button" id="sendCode">发送验证码</button><label class="forgot-only">新密码<input name="new_password" type="password" autocomplete="new-password" placeholder="至少 8 位"></label><button class="btn btn-primary" type="submit" id="authSubmit">登录</button><p class="form-message" id="formMessage" role="status"></p></form></section>
<section id="accountPanel" class="account-card" hidden><div class="account-head"><div><span class="eyebrow">已登录</span><h2 id="profileName">账户</h2><p id="profileEmail"></p></div><button class="btn btn-ghost btn-sm" type="button" id="logoutButton">退出登录</button></div><div class="account-metrics"><div><span>当前套餐</span><strong id="planName">—</strong></div><div><span>本月已用</span><strong><span id="usageUsed">0</span> / <span id="usageQuota">0</span></strong></div><div><span>设备数</span><strong id="deviceCount">—</strong></div></div><div class="usage-bar"><i id="usageBar"></i></div><p class="form-message" id="dashboardMessage" role="status"></p><a class="btn btn-primary" data-download href="#">下载 Windows 版</a></section>
</main><footer class="site-footer"><div class="container footer-copy" style="text-align:center">© 2026 DWGC2E</div></footer>
<script src="js/site-config.js"></script><script src="js/main.js"></script><script src="js/account.js"></script></body></html>
