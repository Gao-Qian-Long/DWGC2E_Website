<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>资料设置 - DWGC2E</title><link rel="stylesheet" href="css/style.css"><link rel="icon" href="favicon.svg"></head><body><header class="account-header"><a class="brand" href="index.html"><img src="assets/logo.svg" alt="" width="34" height="34"><span>DWGC2E</span></a></header><main class="portal-page"><section class="portal-card narrow"><div class="portal-topbar"><a class="portal-back" href="account.html" aria-label="返回账户中心"><span aria-hidden="true">←</span> 返回账户中心</a></div><span class="eyebrow">PROFILE</span><h1>资料设置</h1><p>管理显示名称和账户信息。保存功能等待资料接口开放。</p><form id="profileForm" class="portal-form"><label>显示名称<input name="display_name" placeholder="正在读取…"></label><label>账户邮箱<input name="email" type="email" readonly></label><button class="btn btn-primary" type="submit">保存修改</button></form><hr class="portal-divider"><h2 class="portal-subtitle">修改密码</h2><form id="passwordForm" class="portal-form"><label>新密码<input name="new_password" type="password" minlength="8" autocomplete="new-password" required placeholder="至少 8 位"></label><label>确认新密码<input name="confirm_password" type="password" minlength="8" autocomplete="new-password" required placeholder="再次输入新密码"></label><button class="btn btn-ghost" type="submit">修改密码</button><p id="passwordMessage" class="form-message" role="status"></p></form><p id="portalMessage" class="form-message" role="status"></p></section></main><script src="js/site-config.js?v=20260914-sameorigin"></script><script src="js/api-client.js?v=20260914-sameorigin"></script><script src="js/portal.js"></script></body></html>
