name: website-ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "functions/**"
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "functions/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout API Worker test fixture
        uses: actions/checkout@v4
        with:
          repository: Gao-Qian-Long/DWGC2E
          ref: pro
          path: DWGC2E
          sparse-checkout: cf-worker

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser test runtime
        shell: pwsh
        run: npm install --no-save playwright

      - name: Run isolated regression suite
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_MODULE = 'playwright'
          $env:WORKER_ROOT = Join-Path $env:GITHUB_WORKSPACE 'DWGC2E/cf-worker'
          $env:AUDIT_OUTPUT = Join-Path $env:RUNNER_TEMP 'website-ci-evidence'
          New-Item -ItemType Directory -Force -Path $env:AUDIT_OUTPUT | Out-Null
          $tests = Get-ChildItem tests -File | Where-Object { $_.Extension -in '.cjs', '.mjs' } | ForEach-Object { $_.FullName }
          node --test --test-concurrency=1 $tests

      - name: Verify responsive browser smoke
        shell: pwsh
        run: node tests/browser-smoke.cjs

      - name: Verify public release staging
        shell: pwsh
        run: node tools/stage-site.cjs
